<script>
(function () {
  if (document.documentElement.getAttribute('data-nav-init')) return;
  document.documentElement.setAttribute('data-nav-init', '1');

  function init() {
    var links = Array.from(document.querySelectorAll('.topnav a[href^="#"]'));
    var sections = Array.from(document.querySelectorAll('section.level2[id]'));

    // Highlight the section currently in view
    if (links.length && sections.length) {
      var update = function () {
        var current = sections[0].id;
        var atBottom = window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 50;
        if (atBottom) {
          current = sections[sections.length - 1].id;
        } else {
          sections.forEach(function (s) {
            if (s.getBoundingClientRect().top <= 120) current = s.id;
          });
        }
        links.forEach(function (a) {
          var href = a.getAttribute('href') || '';
          a.classList.toggle('on', href.slice(href.lastIndexOf('#') + 1) === current);
        });
      };
      window.addEventListener('scroll', update, { passive: true });
      update();
    }

    // Paper links open in a new tab
    document.querySelectorAll('a.paper-link').forEach(function (a) {
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
}());
</script>
